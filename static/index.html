<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant Virtuel ESIC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 420px;
      max-width: 100%;
      height: 680px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-info h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .header-info span {
      font-size: 12px;
      opacity: 0.8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4cdc8c;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .clear-btn {
      margin-left: auto;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .clear-btn:hover { background: rgba(255,255,255,0.28); }

    /* Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .bot-avatar {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.bot .bubble {
      background: #f0f4f8;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .timestamp {
      font-size: 10px;
      color: #aaa;
      margin-top: 2px;
      text-align: right;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
    }

    .typing .bubble {
      background: #f0f4f8;
      padding: 12px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing .dot {
      width: 7px;
      height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input */
    .chat-input {
      padding: 14px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: center;
      background: #fff;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus { border-color: #2d6a9f; }

    .send-btn {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #1a3a5c, #2d6a9f);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    .send-btn:hover { transform: scale(1.08); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🎓</div>
    <div class="header-info">
      <h2>Assistant Virtuel ESIC</h2>
      <span><span class="status-dot"></span>En ligne</span>
    </div>
    <button class="clear-btn" id="clearBtn" title="Effacer la conversation">&#128465; Effacer</button>
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">
      <div class="bot-avatar">🤖</div>
      <div>
        <div class="bubble">Bonjour ! Je suis l'assistant virtuel de l'ESIC. Comment puis-je vous aider ?</div>
        <div class="timestamp">maintenant</div>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Posez votre question..." autocomplete="off" />
    <button class="send-btn" id="sendBtn" title="Envoyer">&#10148;</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  const clearBtn   = document.getElementById('clearBtn');

  const WELCOME = '<div class="message bot"><div class="bot-avatar">🤖</div><div><div class="bubble">Bonjour ! Je suis l\'assistant virtuel de l\'ESIC. Comment puis-je vous aider ?</div><div class="timestamp">maintenant</div></div></div>';

  clearBtn.addEventListener('click', () => {
    messagesEl.innerHTML = WELCOME;
    inputEl.focus();
  });

  function getTime() {
    return new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  function appendMessage(text, role) {
    const wrap = document.createElement('div');
    wrap.className = 'message ' + role;

    if (role === 'bot') {
      wrap.innerHTML = `
        <div class="bot-avatar">🤖</div>
        <div>
          <div class="bubble">${text}</div>
          <div class="timestamp">${getTime()}</div>
        </div>`;
    } else {
      wrap.innerHTML = `
        <div>
          <div class="bubble">${text}</div>
          <div class="timestamp">${getTime()}</div>
        </div>`;
    }

    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typing';
    el.innerHTML = `
      <div class="bot-avatar">🤖</div>
      <div class="bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>`;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    sendBtn.disabled = true;
    appendMessage(text, 'user');
    showTyping();

    try {
      const res = await fetch('/predict_chatbot/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, user_id: 'web_user' })
      });
      const data = await res.json();
      hideTyping();
      appendMessage(data.response, 'bot');
    } catch {
      hideTyping();
      appendMessage("Désolé, une erreur s'est produite. Veuillez réessayer.", 'bot');
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
